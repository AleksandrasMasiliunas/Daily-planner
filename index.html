<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hourly Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one centred column. Sticky header (day, progress, focus timer), then top priorities, one row per hour, and a footer with the last seven days and settings. */
  :root {
    color-scheme: light;
    --bg: #f1f4f7;
    --surface: #ffffff;
    --ink: #14202b;
    --muted: #5b6977;
    --line: #d8dfe6;
    --accent: #1d5fd1;
    --accent-ink: #ffffff;
    --accent-soft: #e2ecfb;
    --done: #8b97a3;
    --danger: #b3261e;
    --late: #9a4b00;
    --late-soft: #fdebd3;
    --bar: #bccadb;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151b;
      --surface: #171f27;
      --ink: #e8eef4;
      --muted: #93a1af;
      --line: #28333e;
      --accent: #6aa0f5;
      --accent-ink: #0b1420;
      --accent-soft: #1b2b44;
      --done: #66737f;
      --danger: #f2a39d;
      --late: #f2b872;
      --late-soft: #3a2a14;
      --bar: #33414f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151b;
    --surface: #171f27;
    --ink: #e8eef4;
    --muted: #93a1af;
    --line: #28333e;
    --accent: #6aa0f5;
    --accent-ink: #0b1420;
    --accent-soft: #1b2b44;
    --done: #66737f;
    --danger: #f2a39d;
    --late: #f2b872;
    --late-soft: #3a2a14;
    --bar: #33414f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  button, select, input { font: inherit; color: inherit; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    padding-block: 0 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 10;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  /* Header */
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    padding-block: 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .head-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 2px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.6rem, 6vw, 2.1rem);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }
  .nav { display: flex; gap: 6px; }
  .nav button {
    height: 34px;
    min-width: 34px;
    padding: 0 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .nav button:hover { border-color: var(--muted); }
  .progress { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
  .count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .textbtn {
    font-size: 14px;
    color: var(--muted);
    background: none;
    border: 0;
    padding: 2px 4px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    white-space: nowrap;
  }
  .textbtn:hover { color: var(--ink); }

  /* Focus timer */
  .timer {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 6px 10px;
    margin-top: 12px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--accent-ink);
    white-space: nowrap;
  }
  .pill.late { background: var(--late-soft); color: var(--late); }
  .pill.break { background: var(--done); color: var(--bg); }
  .clock { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1; }
  .ttext { flex: 1 1 8rem; min-width: 0; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbtns { display: flex; gap: 6px; margin-left: auto; }
  .tbtns button {
    height: 32px; padding: 0 12px;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; font-size: 14px;
  }
  .tbtns button:hover { border-color: var(--muted); }

  /* Notes and cards */
  .note {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px;
    margin: 14px 0 0;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-radius: 8px;
    font-size: 14px;
  }
  .note .btns { display: flex; gap: 6px; }
  .note button {
    font-size: 14px; font-weight: 600;
    color: var(--accent); background: none; border: 0; cursor: pointer; padding: 2px 6px;
  }
  .card {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .card h2 {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin: 0 0 8px;
    font-family: var(--font-mono);
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
  }
  .hint { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .hint.warn { color: var(--late); }

  /* Priorities */
  .pri { list-style: none; margin: 0; padding: 0; }
  .pri li { display: flex; align-items: center; gap: 10px; padding: 5px 0; min-height: 36px; }
  .pri .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .pri li.done .text { color: var(--done); text-decoration: line-through; }
  .pri .when { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Hours */
  .hours { list-style: none; margin: 8px 0 0; padding: 0; }
  .hour {
    display: grid;
    grid-template-columns: 4.25rem minmax(0, 1fr);
    gap: 4px 12px;
    padding: 12px 10px;
    border-bottom: 1px solid var(--line);
    border-radius: 10px;
    scroll-margin-top: 190px;
  }
  .hour.now { background: var(--accent-soft); border-bottom-color: transparent; }
  .hour.past .label { color: var(--done); }
  .label {
    font-family: var(--font-mono);
    font-size: 15px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    padding-top: 6px;
    color: var(--muted);
  }
  .hour.now .label { color: var(--accent); }
  .label .pill { display: block; width: max-content; margin-top: 4px; }
  .slot { min-width: 0; }
  .tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .task { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 4px 0; min-height: 40px; }
  input[type="checkbox"] {
    appearance: none;
    flex: none;
    width: 22px; height: 22px;
    margin: 0;
    border: 2px solid var(--muted);
    border-radius: 6px;
    background: var(--surface);
    cursor: pointer;
    display: grid; place-content: center;
  }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:checked::after {
    content: "";
    width: 6px; height: 11px;
    border: solid var(--accent-ink);
    border-width: 0 2px 2px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  .task .text {
    flex: 1 1 7rem; min-width: 0;
    text-align: left;
    background: none; border: 0; padding: 4px 0;
    cursor: text;
    overflow-wrap: anywhere;
  }
  .task .edit {
    flex: 1 1 7rem; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 4px 8px;
  }
  .task.done .text { color: var(--done); text-decoration: line-through; }
  .acts { display: flex; align-items: center; gap: 2px; margin-left: auto; }
  .act {
    display: grid; place-items: center;
    min-width: 32px; height: 32px;
    padding: 0 6px;
    border: 0; border-radius: 8px;
    background: none; color: var(--muted);
    cursor: pointer;
  }
  .act:hover { background: var(--surface); color: var(--ink); }
  .act.txt { font-family: var(--font-mono); font-size: 12px; padding: 0 8px; }
  .act.rm:hover { color: var(--danger); }
  .act[aria-pressed="true"] { color: var(--accent); }
  .act svg path { fill: none; }
  .act[aria-pressed="true"] svg path, .act.play svg path { fill: currentColor; }

  .add { display: flex; align-items: center; gap: 8px; }
  .add .newtext {
    flex: 1; min-width: 0;
    font-size: 15px;
    background: transparent;
    border: 0;
    border-bottom: 1px dashed transparent;
    padding: 8px 0;
    border-radius: 0;
  }
  .add .newtext::placeholder { color: var(--muted); opacity: 0.8; }
  .hour:hover .add .newtext, .add .newtext:focus { border-bottom-color: var(--line); }
  .add .newtext:focus { outline: none; border-bottom: 1px solid var(--accent); }
  .timein {
    height: 34px; padding: 0 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink);
  }
  .add .timein {
    flex: none; width: 6.4rem;
    background: transparent;
    color: var(--muted);
    opacity: 0;
  }
  .add:focus-within .timein, .hour:hover .add .timein { opacity: 1; }
  .tm { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .task.done .tm { color: var(--done); }
  .editbox { flex: 1 1 12rem; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

  /* Footer */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .track { width: 100%; max-width: 36px; height: 72px; display: flex; align-items: flex-end; }
  .fill { width: 100%; min-height: 3px; border-radius: 4px 4px 0 0; background: var(--bar); }
  .col.today .fill { background: var(--accent); }
  .col .d { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .col.today .d { color: var(--ink); font-weight: 500; }
  .col .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stat .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 13px; color: var(--muted); }
  .settings { display: flex; flex-wrap: wrap; gap: 12px 20px; }
  .settings label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .settings select {
    height: 36px; padding: 0 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 14px;
  }

  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    .bar > span { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap"><header>
    <div class="head-top">
      <div>
        <p class="eyebrow" id="dateLine"></p>
        <h1 id="title">Today, by the hour</h1>
      </div>
      <div class="nav">
        <button type="button" id="prevDay" aria-label="Previous day">&#8249;</button>
        <button type="button" id="goToday">Today</button>
        <button type="button" id="nextDay" aria-label="Next day">&#8250;</button>
      </div>
    </div>
    <div class="progress">
      <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
      <span class="count" id="count"></span>
      <button class="textbtn" id="clearDone" type="button">Clear done</button>
    </div>
    <div class="timer" id="timer" hidden>
      <span class="pill" id="timerMode">Focus</span>
      <span class="clock" id="timerClock">25:00</span>
      <span class="ttext" id="timerText"></span>
      <span class="tbtns">
        <button type="button" id="timerPause">Pause</button>
        <button type="button" id="timerStop">Stop</button>
      </span>
    </div>
  </header>

  <div class="note" id="carry" hidden></div>
  <div class="note" id="note" hidden>
    <span>These are example tasks. Remove any you don't need.</span>
    <span class="btns"><button type="button" id="dismissNote">Got it</button></span>
  </div>

  <section class="card" aria-labelledby="priHead">
    <h2 id="priHead"><span>Top priorities</span><span id="priCount"></span></h2>
    <ul class="pri" id="pri"></ul>
    <p class="hint" id="priHint" aria-live="polite"></p>
  </section>

  <ol class="hours" id="hours"></ol>

  <section class="card" aria-labelledby="weekHead">
    <h2 id="weekHead"><span>Last 7 days</span><span>Share of tasks done</span></h2>
    <div class="week" id="week"></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card" aria-labelledby="setHead">
    <h2 id="setHead"><span>Settings</span></h2>
    <div class="settings">
      <label for="setFirst">Day starts
        <select id="setFirst"></select>
      </label>
      <label for="setLast">Last hour shown
        <select id="setLast"></select>
      </label>
      <label for="setFocus">Focus session
        <select id="setFocus"></select>
      </label>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var PREFIX = "hourly-planner-";
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- helpers ---------- */
  function pad2(n) { return String(n).padStart(2, "0"); }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function keyFor(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function hourLabel(h) { return pad2(h) + ":00"; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function clamp(n, lo, hi) { return Math.min(Math.max(n, lo), hi); }
  function timeStr(t) { return pad2(t.hour) + ":" + pad2(t.min || 0); }
  function parseTime(s) {
    var m = /^(\d{1,2}):(\d{2})/.exec(s || "");
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    return h < 24 && mi < 60 ? { h: h, m: mi } : null;
  }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function readJSON(k) {
    var r = lsGet(k);
    if (!r) return null;
    try { return JSON.parse(r); } catch (e) { return null; }
  }
  function readDay(d) {
    var s = readJSON(PREFIX + keyFor(d));
    return s && Array.isArray(s.tasks) ? s : null;
  }
  function writeDay(d, s) { lsSet(PREFIX + keyFor(d), JSON.stringify(s)); }
  function hasAnyDay() {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        if (/^hourly-planner-\d{4}-\d{2}-\d{2}$/.test(localStorage.key(i))) return true;
      }
    } catch (e) {}
    return false;
  }
  function emptyDay() { return { seeded: false, tasks: [] }; }
  function seedDay() {
    return {
      seeded: true,
      tasks: [
        { id: uid(), hour: 8,  text: "Breakfast and review the day", done: false, star: false },
        { id: uid(), hour: 9,  text: "Deep work: most important task", done: false, star: true },
        { id: uid(), hour: 13, text: "Lunch away from the screen", done: false, star: false },
        { id: uid(), hour: 15, text: "Reply to emails", done: false, star: false },
        { id: uid(), hour: 18, text: "Go for a walk", done: false, star: false }
      ]
    };
  }

  /* ---------- state ---------- */
  var settings = { first: 6, last: 22, focus: 25 };
  var savedSettings = readJSON(PREFIX + "settings");
  if (savedSettings) {
    ["first", "last", "focus"].forEach(function (k) {
      if (typeof savedSettings[k] === "number") settings[k] = savedSettings[k];
    });
  }
  function saveSettings() { lsSet(PREFIX + "settings", JSON.stringify(settings)); }

  var viewDate = startOfDay(new Date());
  var state = readDay(viewDate);
  if (!state) {
    if (hasAnyDay()) { state = emptyDay(); }
    else { state = seedDay(); writeDay(viewDate, state); }
  }
  function save() { writeDay(viewDate, state); }

  function dayDiff() {
    return Math.round((startOfDay(viewDate) - startOfDay(new Date())) / 86400000);
  }
  function range() {
    var f = settings.first, l = settings.last;
    state.tasks.forEach(function (t) {
      if (t.hour < f) f = t.hour;
      if (t.hour > l) l = t.hour;
    });
    return [f, l];
  }

  /* ---------- focus timer ---------- */
  var timer = (function () {
    var t = readJSON(PREFIX + "timer");
    if (!t || typeof t.endsAt !== "number") return null;
    if (!t.paused && t.endsAt <= Date.now()) { lsDel(PREFIX + "timer"); return null; }
    return t;
  })();
  var audio = null;
  function saveTimer() {
    if (timer) lsSet(PREFIX + "timer", JSON.stringify(timer)); else lsDel(PREFIX + "timer");
  }
  function ensureAudio() {
    try {
      if (!audio) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (C) audio = new C();
      }
      if (audio && audio.state === "suspended") audio.resume();
    } catch (e) {}
  }
  function beep(n) {
    try {
      ensureAudio();
      if (!audio) return;
      for (var i = 0; i < n; i++) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880;
        g.gain.value = 0.08;
        o.connect(g); g.connect(audio.destination);
        var t0 = audio.currentTime + i * 0.3;
        o.start(t0); o.stop(t0 + 0.18);
      }
    } catch (e) {}
  }
  function focusKey() { return PREFIX + "focus-" + keyFor(new Date()); }
  function readFocus() {
    var f = readJSON(focusKey());
    return f && typeof f.minutes === "number" ? f : { sessions: 0, minutes: 0 };
  }
  function startFocus(t) {
    var ms = settings.focus * 60000;
    timer = { mode: "focus", total: ms, endsAt: Date.now() + ms, left: ms, paused: false,
              text: t.text, taskId: t.id, dayKey: keyFor(viewDate) };
    ensureAudio(); saveTimer(); render();
  }
  function startBreak() {
    var ms = 5 * 60000;
    timer = { mode: "break", total: ms, endsAt: Date.now() + ms, left: ms, paused: false,
              text: "Stand up, stretch, drink some water.", taskId: null, dayKey: null };
  }
  function completeTimer() {
    if (timer.mode === "focus") {
      var f = readFocus();
      f.sessions += 1;
      f.minutes += Math.round(timer.total / 60000);
      lsSet(focusKey(), JSON.stringify(f));
      beep(2);
      startBreak();
    } else {
      beep(1);
      timer = null;
    }
    saveTimer(); render();
  }
  function updateTimer() {
    var el = $("timer");
    if (!timer) { el.hidden = true; return; }
    el.hidden = false;
    var left = timer.paused ? timer.left : Math.max(0, timer.endsAt - Date.now());
    var s = Math.ceil(left / 1000);
    $("timerClock").textContent = pad2(Math.floor(s / 60)) + ":" + pad2(s % 60);
    var mode = $("timerMode");
    mode.textContent = timer.mode === "focus" ? "Focus" : "Break";
    mode.className = "pill" + (timer.mode === "break" ? " break" : "");
    $("timerText").textContent = timer.text || "";
    $("timerPause").textContent = timer.paused ? "Resume" : "Pause";
    $("timerStop").textContent = timer.mode === "break" ? "Skip" : "Stop";
  }
  $("timerPause").addEventListener("click", function () {
    if (!timer) return;
    ensureAudio();
    if (timer.paused) { timer.endsAt = Date.now() + timer.left; timer.paused = false; }
    else { timer.left = Math.max(0, timer.endsAt - Date.now()); timer.paused = true; }
    saveTimer(); updateTimer();
  });
  $("timerStop").addEventListener("click", function () {
    timer = null; saveTimer(); render();
  });
  setInterval(function () {
    if (!timer || timer.paused) return;
    if (Date.now() >= timer.endsAt) completeTimer(); else updateTimer();
  }, 250);

  /* ---------- icons ---------- */
  var ICON_STAR = '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 2.5l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L2.8 7.8l5-.7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  var ICON_PLAY = '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M6 4l10 6-10 6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  var ICON_X = '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  /* ---------- building blocks ---------- */
  function makeCheckbox(t) {
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!t.done;
    cb.setAttribute("aria-label", "Mark done: " + t.text);
    cb.addEventListener("change", function () { t.done = cb.checked; save(); render(); });
    return cb;
  }
  function makeAct(cls, html, label, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "act " + cls;
    b.innerHTML = html;
    b.setAttribute("aria-label", label);
    b.title = label;
    b.addEventListener("click", onClick);
    return b;
  }
  function removeTask(t) {
    state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; });
    save(); render();
  }
  function toggleStar(t) {
    var hint = $("priHint");
    if (!t.star && state.tasks.filter(function (x) { return x.star; }).length >= 3) {
      hint.textContent = "Three is the limit. Unstar one first.";
      hint.className = "hint warn";
      return;
    }
    t.star = !t.star;
    save(); render();
  }
  function startEdit(t, btn) {
    var box = document.createElement("span");
    box.className = "editbox";
    var input = document.createElement("input");
    input.type = "text";
    input.className = "edit";
    input.value = t.text;
    input.setAttribute("aria-label", "Edit task");
    var time = document.createElement("input");
    time.type = "time";
    time.className = "timein";
    time.step = 300;
    time.value = timeStr(t);
    time.setAttribute("aria-label", "Start time");
    var ok = document.createElement("button");
    ok.type = "button"; ok.className = "act txt"; ok.textContent = "Save";
    var no = document.createElement("button");
    no.type = "button"; no.className = "act txt"; no.textContent = "Cancel";
    box.appendChild(input); box.appendChild(time); box.appendChild(ok); box.appendChild(no);
    btn.replaceWith(box);
    input.focus(); input.select();
    function commit() {
      var v = input.value.trim();
      var tv = parseTime(time.value);
      if (v) t.text = v;
      if (tv) { t.hour = tv.h; t.min = tv.m; }
      save(); render();
    }
    ok.addEventListener("click", commit);
    no.addEventListener("click", function () { render(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      else if (e.key === "Escape") { render(); }
    });
  }

  function buildTask(t, ctx) {
    var li = document.createElement("li");
    li.className = "task" + (t.done ? " done" : "");
    li.appendChild(makeCheckbox(t));
    if (t.min) {
      var tm = document.createElement("span");
      tm.className = "tm"; tm.textContent = timeStr(t);
      li.appendChild(tm);
    }

    var text = document.createElement("button");
    text.type = "button";
    text.className = "text";
    text.textContent = t.text;
    text.title = "Click to edit";
    text.addEventListener("click", function () { startEdit(t, text); });
    li.appendChild(text);

    var late = !t.done && (ctx.diff < 0 || (ctx.diff === 0 && t.hour < ctx.cur));
    var focusing = timer && timer.mode === "focus" && timer.taskId === t.id && timer.dayKey === keyFor(viewDate);
    if (late) {
      var p = document.createElement("span");
      p.className = "pill late"; p.textContent = "Late";
      li.appendChild(p);
    }
    if (focusing) {
      var f = document.createElement("span");
      f.className = "pill"; f.textContent = "Focusing";
      li.appendChild(f);
    }

    var acts = document.createElement("span");
    acts.className = "acts";

    var star = makeAct("star", ICON_STAR, t.star ? "Remove from top priorities" : "Add to top priorities", function () { toggleStar(t); });
    star.setAttribute("aria-pressed", t.star ? "true" : "false");
    acts.appendChild(star);

    if (!t.done) {
      acts.appendChild(makeAct("play", ICON_PLAY, "Start a " + settings.focus + " minute focus timer", function () { startFocus(t); }));
    }
    if (!t.done) {
      if (late && ctx.diff === 0 && ctx.cur <= ctx.last) {
        var now = makeAct("txt", "To now", "Move to the current hour", function () { t.hour = ctx.cur; t.min = 0; save(); render(); });
        acts.appendChild(now);
      } else if (!late && t.hour < ctx.last) {
        var push = makeAct("txt", "+1h", "Push to the next hour", function () { t.hour = t.hour + 1; save(); render(); });
        acts.appendChild(push);
      }
    }
    acts.appendChild(makeAct("rm", ICON_X, "Remove task", function () { removeTask(t); }));
    li.appendChild(acts);
    return li;
  }

  function buildHour(h, ctx) {
    var li = document.createElement("li");
    li.className = "hour" + (ctx.diff === 0 && h === ctx.cur ? " now" : "") + (ctx.diff === 0 && h < ctx.cur ? " past" : "");
    li.id = "hour-" + h;

    var label = document.createElement("div");
    label.className = "label";
    label.textContent = hourLabel(h);
    if (ctx.diff === 0 && h === ctx.cur) {
      var tag = document.createElement("span");
      tag.className = "pill"; tag.textContent = "Now";
      label.appendChild(tag);
    }
    li.appendChild(label);

    var slot = document.createElement("div");
    slot.className = "slot";
    var list = document.createElement("ul");
    list.className = "tasks";
    state.tasks.filter(function (t) { return t.hour === h; })
      .sort(function (a, b) { return (a.min || 0) - (b.min || 0); })
      .forEach(function (t) { list.appendChild(buildTask(t, ctx)); });
    slot.appendChild(list);

    var form = document.createElement("form");
    form.className = "add";
    var input = document.createElement("input");
    input.type = "text";
    input.className = "newtext";
    input.id = "add-" + h;
    input.placeholder = "Add a task at " + hourLabel(h);
    input.autocomplete = "off";
    input.setAttribute("aria-label", "Add a task at " + hourLabel(h));
    var time = document.createElement("input");
    time.type = "time";
    time.className = "timein";
    time.id = "time-" + h;
    time.step = 300;
    time.value = hourLabel(h);
    time.setAttribute("aria-label", "Start time");
    form.appendChild(input);
    form.appendChild(time);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (!v) return;
      var hh = h, mm = 0;
      var tv = parseTime(time.value);
      if (tv) { hh = tv.h; mm = tv.m; }
      // Typing a time first also works, for example "6:30 gym".
      var m = v.match(/^(\d{1,2})[:.](\d{2})\s+(.+)$/);
      if (m && +m[1] < 24 && +m[2] < 60) { hh = +m[1]; mm = +m[2]; v = m[3].trim(); }
      input.value = "";
      state.tasks.push({ id: uid(), hour: hh, min: mm, text: v, done: false, star: false });
      save(); render(h);
    });
    slot.appendChild(form);
    li.appendChild(slot);
    return li;
  }

  /* ---------- sections ---------- */
  function renderHeader(diff) {
    var names = { "-1": "Yesterday", "0": "Today", "1": "Tomorrow" };
    var weekday = viewDate.toLocaleDateString("en-GB", { weekday: "long" });
    $("title").textContent = (names[String(diff)] || weekday) + ", by the hour";
    $("dateLine").textContent = viewDate.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    $("goToday").disabled = diff === 0;
    var total = state.tasks.length;
    var done = state.tasks.filter(function (t) { return t.done; }).length;
    $("count").textContent = done + " of " + total + " done";
    $("barFill").style.width = total ? (done / total * 100) + "%" : "0";
  }

  function renderCarry(diff) {
    var el = $("carry");
    el.hidden = true;
    el.innerHTML = "";
    if (diff < 0 || state.carryDismissed) return;
    var src = addDays(viewDate, -1);
    var srcState = readDay(src);
    if (!srcState) return;
    var left = srcState.tasks.filter(function (t) { return !t.done; });
    if (!left.length) return;
    var srcName = diff === 0 ? "yesterday" : diff === 1 ? "today" : src.toLocaleDateString("en-GB", { weekday: "long" });

    var msg = document.createElement("span");
    msg.textContent = left.length + (left.length === 1 ? " unfinished task from " : " unfinished tasks from ") + srcName + ".";
    var btns = document.createElement("span");
    btns.className = "btns";

    var move = document.createElement("button");
    move.type = "button"; move.textContent = "Move here";
    move.addEventListener("click", function () {
      var r = range();
      var hour = diff === 0 ? clamp(new Date().getHours(), r[0], r[1]) : settings.first;
      left.forEach(function (t) {
        state.tasks.push({ id: uid(), hour: hour, text: t.text, done: false, star: !!t.star });
      });
      srcState.tasks = srcState.tasks.filter(function (t) { return t.done; });
      writeDay(src, srcState);
      save(); render();
    });
    var dismiss = document.createElement("button");
    dismiss.type = "button"; dismiss.textContent = "Dismiss";
    dismiss.addEventListener("click", function () { state.carryDismissed = true; save(); render(); });

    btns.appendChild(move); btns.appendChild(dismiss);
    el.appendChild(msg); el.appendChild(btns);
    el.hidden = false;
  }

  function renderPriorities() {
    var list = $("pri");
    list.innerHTML = "";
    var pri = state.tasks.filter(function (t) { return t.star; }).sort(function (a, b) { return (a.hour * 60 + (a.min || 0)) - (b.hour * 60 + (b.min || 0)); });
    $("priCount").textContent = pri.length + " of 3";
    pri.forEach(function (t) {
      var li = document.createElement("li");
      li.className = t.done ? "done" : "";
      li.appendChild(makeCheckbox(t));
      var text = document.createElement("span");
      text.className = "text"; text.textContent = t.text;
      var when = document.createElement("span");
      when.className = "when"; when.textContent = timeStr(t);
      li.appendChild(text); li.appendChild(when);
      list.appendChild(li);
    });
    var hint = $("priHint");
    hint.className = "hint";
    hint.textContent = pri.length
      ? ""
      : "Star up to three tasks to pin them here. Do these first. Press play on any task to start a " + settings.focus + " minute focus timer.";
  }

  function renderWeek() {
    var wrap = $("week");
    wrap.innerHTML = "";
    var weekDone = 0;
    var today = startOfDay(new Date());
    for (var i = 6; i >= 0; i--) {
      var d = addDays(today, -i);
      var s = readDay(d);
      var total = s ? s.tasks.length : 0;
      var done = s ? s.tasks.filter(function (t) { return t.done; }).length : 0;
      weekDone += done;
      var pct = total ? Math.round(done / total * 100) : 0;

      var col = document.createElement("div");
      col.className = "col" + (i === 0 ? " today" : "");
      col.title = d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) + ": " + done + " of " + total + " done";
      var track = document.createElement("div");
      track.className = "track";
      var fill = document.createElement("div");
      fill.className = "fill";
      fill.style.height = pct + "%";
      track.appendChild(fill);
      var dl = document.createElement("div");
      dl.className = "d"; dl.textContent = d.toLocaleDateString("en-GB", { weekday: "short" }).slice(0, 3);
      var nl = document.createElement("div");
      nl.className = "n"; nl.textContent = total ? done + "/" + total : "-";
      col.appendChild(track); col.appendChild(dl); col.appendChild(nl);
      wrap.appendChild(col);
    }

    var streak = 0;
    for (var j = 0; j < 60; j++) {
      var sd = readDay(addDays(today, -j));
      var dn = sd ? sd.tasks.filter(function (t) { return t.done; }).length : 0;
      if (dn > 0) streak++;
      else if (j === 0) continue;
      else break;
    }
    var focus = readFocus();
    var stats = $("stats");
    stats.innerHTML = "";
    [
      ["Day streak", String(streak), streak === 1 ? "day with a task done" : "days with a task done"],
      ["Done this week", String(weekDone), weekDone === 1 ? "task" : "tasks"],
      ["Focus today", focus.minutes + " min", focus.sessions + (focus.sessions === 1 ? " session" : " sessions")]
    ].forEach(function (r) {
      var st = document.createElement("div");
      st.className = "stat";
      var k = document.createElement("div"); k.className = "k"; k.textContent = r[0];
      var v = document.createElement("div"); v.className = "v"; v.textContent = r[1];
      var sub = document.createElement("div"); sub.className = "s"; sub.textContent = r[2];
      st.appendChild(k); st.appendChild(v); st.appendChild(sub);
      stats.appendChild(st);
    });
  }

  function render(focusHour) {
    // Keep anything typed in the add fields while the page rebuilds.
    var saved = {};
    var active = document.activeElement;
    var activeId = active && active.classList && active.closest && active.closest(".add") ? active.id : null;
    document.querySelectorAll(".add .newtext").forEach(function (i) { if (i.value) saved[i.id] = i.value; });

    var diff = dayDiff();
    var r = range();
    var ctx = { cur: new Date().getHours(), diff: diff, last: r[1] };

    renderHeader(diff);
    renderCarry(diff);
    $("note").hidden = !state.seeded;
    renderPriorities();

    var hoursEl = $("hours");
    hoursEl.innerHTML = "";
    for (var h = r[0]; h <= r[1]; h++) hoursEl.appendChild(buildHour(h, ctx));

    Object.keys(saved).forEach(function (id) {
      var el = $(id);
      if (el) el.value = saved[id];
    });
    var target = focusHour != null ? "add-" + focusHour : activeId;
    if (target && $(target)) $(target).focus();

    renderWeek();
    updateTimer();
  }

  /* ---------- controls ---------- */
  function go(d) {
    viewDate = startOfDay(d);
    state = readDay(viewDate) || emptyDay();
    render();
    scrollToNow();
  }
  function scrollToNow() {
    var diff = dayDiff();
    if (diff !== 0) { window.scrollTo(0, 0); return; }
    var r = range();
    var cur = new Date().getHours();
    if (cur <= r[0]) { window.scrollTo(0, 0); return; }
    var el = $("hour-" + clamp(cur, r[0], r[1]));
    if (el) { try { el.scrollIntoView({ block: "start" }); } catch (e) {} }
  }
  $("prevDay").addEventListener("click", function () { go(addDays(viewDate, -1)); });
  $("nextDay").addEventListener("click", function () { go(addDays(viewDate, 1)); });
  $("goToday").addEventListener("click", function () { go(new Date()); });
  $("clearDone").addEventListener("click", function () {
    state.tasks = state.tasks.filter(function (t) { return !t.done; });
    save(); render();
  });
  $("dismissNote").addEventListener("click", function () { state.seeded = false; save(); render(); });

  function fillSelect(id, values, fmt, current) {
    var sel = $(id);
    values.forEach(function (v) {
      var o = document.createElement("option");
      o.value = String(v); o.textContent = fmt(v);
      if (v === current) o.selected = true;
      sel.appendChild(o);
    });
    return sel;
  }
  var rangeOf = function (a, b) { var o = []; for (var i = a; i <= b; i++) o.push(i); return o; };
  fillSelect("setFirst", rangeOf(4, 12), hourLabel, settings.first).addEventListener("change", function (e) {
    settings.first = parseInt(e.target.value, 10); saveSettings(); render();
  });
  fillSelect("setLast", rangeOf(16, 23), hourLabel, settings.last).addEventListener("change", function (e) {
    settings.last = parseInt(e.target.value, 10); saveSettings(); render();
  });
  fillSelect("setFocus", [15, 25, 45, 60], function (m) { return m + " minutes"; }, settings.focus).addEventListener("change", function (e) {
    settings.focus = parseInt(e.target.value, 10); saveSettings(); render();
  });

  /* ---------- start ---------- */
  render();
  scrollToNow();

  // Move the "Now" marker when the hour changes.
  var lastHour = new Date().getHours();
  setInterval(function () {
    var h = new Date().getHours();
    if (h !== lastHour) { lastHour = h; render(); }
  }, 30000);
})();
</script>
</body>
</html>
